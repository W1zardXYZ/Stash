name: Docker image

# Publishes ghcr.io/<owner>/stash for TrueNAS / HexOS / any Docker host.
#   default branch -> :latest and :sha-xxxxxxx
#   tag v1.2.3     -> :1.2.3, :1.2, :latest
#   other branches -> built (to catch errors) but not pushed, unless started by hand
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: publish
        name: Decide whether to push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ github.ref_type }}" = "tag" ] \
             || [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.publish.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stash
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Blender ships x86-64 Linux builds only; N100/N150/N305 and other Intel/AMD NAS CPUs are amd64.
          platforms: linux/amd64
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: steps.publish.outputs.push == 'true'
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name stash -p 8420:8420 --user 568:568 "$image"
          for i in $(seq 60); do curl -fs http://localhost:8420/api/status && break; sleep 2; done
          curl -fs http://localhost:8420/api/status | grep '"blender":true'
          docker logs stash | tail -20
